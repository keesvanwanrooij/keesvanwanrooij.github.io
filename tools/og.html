<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>OG-afbeelding</title>
<!--
  Bron van assets/img/og.png (1200x630). Opnieuw maken met de site lokaal op poort 8123:
  msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=assets/img/og.png http://localhost:8123/tools/og.html
-->
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #fff; }
  .og { display: grid; grid-template-columns: 1fr 504px; width: 1200px; height: 630px; }
  .og-text { display: flex; flex-direction: column; justify-content: center; padding: 0 72px; }
  .og-text .label { font-size: 20px; margin-bottom: 28px; }
  .og-text h1 { font-size: 88px; line-height: 1.02; letter-spacing: -0.03em; max-width: none; margin: 0 0 32px; }
  .og-text h1 .dot { color: #c4303c; }
  .og-text p { font-size: 32px; font-weight: 300; line-height: 1.35; margin: 0 0 40px; max-width: 520px; }
  .og-text .url { font-family: "JetBrains Mono", monospace; font-size: 22px; color: #68686d; margin: 0; }
  .og-photo { width: 504px; height: 630px; background: url("/assets/img/kees-van-wanrooij-800.jpg") center top / cover; }
</style>
</head>
<body>
  <div class="og">
    <div class="og-text">
      <p class="label">Belegger en NLP-practitioner</p>
      <h1>Kees van<br>Wanrooij<span class="dot">.</span></h1>
      <p>We sluiten de kloof tussen weten en doen.</p>
      <p class="url">keesvanwanrooij.nl</p>
    </div>
    <div class="og-photo" role="img" aria-label="Kees van Wanrooij"></div>
  </div>
</body>
</html>
